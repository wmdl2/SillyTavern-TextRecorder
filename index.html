<!-- Floating Window UI -->
<div id="st-text-recorder-container" class="st-text-recorder-container" style="display: none;">
    <div id="st-text-recorder-header" class="st-text-recorder-header">
        <div class="st-text-recorder-title">
            <i class="fa-solid fa-book"></i>
            <span>文本记录本</span>
        </div>
        <div class="st-text-recorder-controls">
            <div id="st-text-recorder-minimize" class="st-text-recorder-icon-btn" title="最小化">
                <i class="fa-solid fa-minus"></i>
            </div>
            <div id="st-text-recorder-close" class="st-text-recorder-close-btn" title="关闭">
                <i class="fa-solid fa-xmark"></i>
            </div>
        </div>
    </div>
    <div class="st-text-recorder-body">
        <div class="st-text-recorder-sidebar">
            <div class="st-text-recorder-toolbar">
                <div id="st-text-recorder-add-folder" class="st-text-recorder-icon-btn" title="新建文件夹">
                    <i class="fa-solid fa-folder-plus"></i>
                </div>
                <div id="st-text-recorder-add-file" class="st-text-recorder-icon-btn" title="新建文本">
                    <i class="fa-solid fa-file-circle-plus"></i>
                </div>
            </div>
            <div id="st-text-recorder-tree" class="st-text-recorder-tree">
                <!-- Tree items will be injected here -->
            </div>
        </div>
        <div class="st-text-recorder-resizer-x" id="st-text-recorder-resizer-x"></div>
        <div id="st-text-recorder-editor-area" class="st-text-recorder-editor-area" style="display: none;">
            <div class="st-text-recorder-editor-toolbar">
                <div class="st-text-recorder-toolbar-left">
                    <span id="st-text-recorder-current-title" class="st-text-recorder-current-title"></span>
                </div>
                <div class="st-text-recorder-toolbar-right">
                    <div id="st-text-recorder-copy" class="st-text-recorder-icon-btn" title="复制文本">
                        <i class="fa-solid fa-copy"></i>
                    </div>
                    <div id="st-text-recorder-paste" class="st-text-recorder-icon-btn" title="粘贴文本">
                        <i class="fa-solid fa-paste"></i>
                    </div>
                    <div id="st-text-recorder-clear" class="st-text-recorder-icon-btn" title="清空内容">
                        <i class="fa-solid fa-eraser"></i>
                    </div>
                    <div id="st-text-recorder-save" class="st-text-recorder-icon-btn st-text-recorder-save-btn" title="保存修改">
                        <i class="fa-solid fa-floppy-disk"></i>
                    </div>
                    <div id="st-text-recorder-delete" class="st-text-recorder-icon-btn st-text-recorder-delete-btn" title="删除该文本/文件夹">
                        <i class="fa-solid fa-trash"></i>
                    </div>
                </div>
            </div>
            <textarea id="st-text-recorder-textarea" class="st-text-recorder-textarea text_pole" placeholder="在这里输入内容... 修改后请务必点击上方的【保存】按钮！"></textarea>
        </div>
        <div id="st-text-recorder-empty-state" class="st-text-recorder-empty-state">
            <span>请在左侧选择或新建一个文本以开始编辑...</span>
        </div>
    </div>
    <div id="st-text-recorder-resize-handle" class="st-text-recorder-resize-handle">
        <i class="fa-solid fa-caret-down" style="transform: rotate(-45deg);"></i>
    </div>
</div>

<!-- Settings Panel UI (Injected into #extensions_settings) -->
<div id="st-text-recorder-settings-panel" class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b>文本记录器设置</b>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down"></div>
    </div>
    <div class="inline-drawer-content">
        <div class="settings_section flex-container">
            <input type="checkbox" id="st-text-recorder-enable-checkbox">
            <label for="st-text-recorder-enable-checkbox">启用文本记录器</label>
        </div>
        <hr class="sysHR" />
        <div class="settings_section flex-container alignitemscenter flexGapSm">
            <label>悬浮窗主题色:</label>
            <select id="st-text-recorder-theme-select" class="text_pole">
                <option value="default">默认 (跟随酒馆)</option>
                <option value="dark">纯黑 (Dark)</option>
                <option value="blue">深蓝 (Navy)</option>
                <option value="green">墨绿 (Forest)</option>
                <option value="amber">琥珀 (Amber)</option>
            </select>
        </div>
        <hr class="sysHR" />
    </div>
</div>
